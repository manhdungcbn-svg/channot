<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Flash sale giảm tới 50%">
  <defs>
    <linearGradient id="fsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="32%" stop-color="#5B21B6"/>
      <stop offset="62%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="fsGlow1" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#FB923C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fsGlow2" cx="0.12" cy="0.92" r="0.5">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fsCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#EDE9FE" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="fsBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="fsSpeaker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="fsStrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>

  <!-- Nền gradient -->
  <rect width="900" height="500" fill="url(#fsBg)"/>

  <!-- Vòng sáng toả -->
  <rect width="900" height="500" fill="url(#fsGlow1)"/>
  <rect width="900" height="500" fill="url(#fsGlow2)"/>

  <!-- Tia sáng loé từ góc phải -->
  <g opacity="0.28" fill="#FEF3C7">
    <polygon points="760,0 900,0 900,150"/>
    <polygon points="700,0 740,0 900,300 900,360"/>
    <polygon points="820,0 860,0 900,90 900,130"/>
  </g>

  <!-- Hạt kim tuyến rải rác -->
  <g fill="#FDE68A">
    <circle cx="120" cy="70" r="4" opacity="0.9"/>
    <circle cx="205" cy="150" r="3" opacity="0.7"/>
    <circle cx="80" cy="250" r="3.5" opacity="0.6"/>
    <circle cx="300" cy="60" r="2.5" opacity="0.8"/>
    <circle cx="640" cy="440" r="3" opacity="0.5"/>
    <circle cx="520" cy="80" r="2.5" opacity="0.6"/>
    <circle cx="360" cy="410" r="3" opacity="0.5"/>
  </g>
  <g fill="#FCA5A5" opacity="0.8">
    <rect x="150" y="330" width="9" height="9" rx="2" transform="rotate(20 154 334)"/>
    <rect x="420" y="120" width="8" height="8" rx="2" transform="rotate(-15 424 124)"/>
    <rect x="720" y="330" width="9" height="9" rx="2" transform="rotate(35 724 334)"/>
  </g>

  <!-- Tiêu đề lớn -->
  <text x="70" y="150" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-2">FLASH SALE</text>
  <text x="72" y="196" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#FDE68A" letter-spacing="6">HÔM NAY</text>

  <!-- Gạch chân neon -->
  <rect x="70" y="212" width="300" height="8" rx="4" fill="#22D3EE" opacity="0.9"/>

  <!-- Mô tả -->
  <text x="72" y="262" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#FDE7F3">Giảm tới 50% cho 200 sản phẩm</text>
  <text x="72" y="292" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#E9D5FF">Miễn phí vận chuyển toàn quốc</text>

  <!-- Badge tròn -50% -->
  <g transform="translate(742 118) rotate(-12)">
    <circle r="78" fill="url(#fsBadge)" stroke="#FFF7ED" stroke-width="6"/>
    <circle r="64" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.55" stroke-dasharray="6 9"/>
    <text x="0" y="-4" text-anchor="middle" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">50%</text>
    <text x="0" y="30" text-anchor="middle" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFF7ED">GIẢM</text>
  </g>

  <!-- Minh hoạ loa bluetooth -->
  <g transform="translate(560 250)">
    <rect x="0" y="0" width="150" height="196" rx="26" fill="url(#fsSpeaker)" opacity="0.96"/>
    <circle cx="75" cy="72" r="42" fill="#312E81" opacity="0.9"/>
    <circle cx="75" cy="72" r="26" fill="#4F46E5" opacity="0.95"/>
    <circle cx="75" cy="72" r="10" fill="#C7D2FE"/>
    <rect x="46" y="130" width="58" height="10" rx="5" fill="#312E81" opacity="0.55"/>
    <rect x="60" y="152" width="30" height="8" rx="4" fill="#312E81" opacity="0.35"/>
    <path d="M196 76 h26 l-16 -18 v40 z" fill="#22D3EE"/>
    <path d="M222 76 h22" stroke="#22D3EE" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M238 60 c12 8 12 24 0 32" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- Sản phẩm mini -->
  <g transform="translate(70 336)">
    <rect x="0" y="0" width="120" height="96" rx="16" fill="url(#fsCard)"/>
    <rect x="30" y="20" width="60" height="44" rx="8" fill="#312E81" opacity="0.85"/>
    <rect x="38" y="28" width="44" height="28" rx="5" fill="#22D3EE" opacity="0.9"/>
    <text x="60" y="86" text-anchor="middle" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#312E81">Tivi 4K</text>
  </g>
  <g transform="translate(206 336)">
    <rect x="0" y="0" width="120" height="96" rx="16" fill="url(#fsCard)"/>
    <circle cx="60" cy="42" r="24" fill="#BE123C" opacity="0.9"/>
    <circle cx="60" cy="42" r="12" fill="#FDE68A"/>
    <text x="60" y="86" text-anchor="middle" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#312E81">Loa Bluetooth</text>
  </g>
  <g transform="translate(342 336)">
    <rect x="0" y="0" width="120" height="96" rx="16" fill="url(#fsCard)"/>
    <rect x="42" y="18" width="36" height="50" rx="8" fill="#0369A1" opacity="0.9"/>
    <circle cx="60" cy="32" r="6" fill="#E0F2FE"/>
    <text x="60" y="86" text-anchor="middle" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#312E81">Máy lọc nước</text>
  </g>

  <!-- Dải mã giảm giá -->
  <g transform="translate(70 452)">
    <rect x="0" y="0" width="392" height="34" rx="17" fill="url(#fsStrip)"/>
    <text x="18" y="23" font-family="DM Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Mã ưu đãi: WELCOME10</text>
  </g>
</svg>