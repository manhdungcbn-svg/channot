version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: warranty_db
    ports:
      - "5433:5432"
    volumes:
      - warranty_pgdata:/var/lib/postgresql/data
    networks:
      - warranty_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: warranty_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@warranty.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - warranty_net

  backend:
    build:
      context: ./backend
    container_name: warranty_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://admin:secretpassword@db:5432/warranty_db
      - SECRET_KEY=warranty_secret_change_in_prod
      - BACKEND_CORS_ORIGINS=["http://localhost", "http://localhost:5174"]
    ports:
      - "8001:8000"
    depends_on:
      - db
    networks:
      - warranty_net

  frontend:
    build:
      context: ./frontend
    container_name: warranty_frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - warranty_net

volumes:
  warranty_pgdata:

networks:
  warranty_net:
    driver: bridge